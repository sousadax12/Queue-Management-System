org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true

# Gradle Plugin Versions
androidGradlePluginVersion=9.3.1
kotlinVersion=2.4.20
googleServicesVersion=4.4.2

# AGP 9 compatibility flags. The Flutter tool adds these to projects that are
# not on AGP 9's new DSL yet; see
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.newDsl=false
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 (via youtube_player_flutter) still calls
# getDefaultProguardFile('proguard-android.txt'), which AGP 9 rejects by default.
android.r8.proguardAndroidTxt.disallowed=false
