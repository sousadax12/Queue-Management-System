name: Admin portal

# Called by ci.yml, which decides from the changed paths whether it runs.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: admin-portal

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: admin-portal/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: admin-portal/.nvmrc
          cache: pnpm
          cache-dependency-path: admin-portal/pnpm-lock.yaml

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('admin-portal/pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r test

      - name: Emulator tests
        run: pnpm -r test:emulator

      - name: Build web
        run: pnpm --filter @qms/web build

  image:
    name: Web image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Built on every run to catch Dockerfile breakage; pushed to GHCR only from main.
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/qms-admin-web
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: admin-portal
          file: admin-portal/apps/web/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=qms-admin-web
          cache-to: type=gha,mode=max,scope=qms-admin-web

  deploy:
    name: Deploy web (Coolify)
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Secrets can't gate a job directly, so the step checks them. Without COOLIFY_WEBHOOK
    # the job passes and deploys nothing.
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

    steps:
      - name: Skip (COOLIFY_WEBHOOK not set)
        if: env.COOLIFY_WEBHOOK == ''
        run: echo "COOLIFY_WEBHOOK is not set; skipping the deploy."
        working-directory: .

      - name: Trigger Coolify deploy
        if: env.COOLIFY_WEBHOOK != ''
        working-directory: .
        run: |
          auth=()
          if [ -n "$COOLIFY_TOKEN" ]; then auth=(-H "Authorization: Bearer $COOLIFY_TOKEN"); fi
          curl --fail-with-body --silent --show-error --max-time 60 "${auth[@]}" "$COOLIFY_WEBHOOK"
