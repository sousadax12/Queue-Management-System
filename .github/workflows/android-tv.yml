name: Android TV

on:
  push:
    branches:
      - main
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
      # The shared Firestore contract (C8): the mapper tests read the fixtures, and a drift
      # test reads QUEUE_DEFAULTS and TEMPLATE_IDS from the schemas.
      - 'admin-portal/packages/contract/fixtures/**'
      - 'admin-portal/packages/contract/src/schemas/**'
  pull_request:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
      # The shared Firestore contract (C8): the mapper tests read the fixtures, and a drift
      # test reads QUEUE_DEFAULTS and TEMPLATE_IDS from the schemas.
      - 'admin-portal/packages/contract/fixtures/**'
      - 'admin-portal/packages/contract/src/schemas/**'

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests and debug APK
        working-directory: android-tv
        run: ./gradlew lint testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-reports
          path: |
            android-tv/*/build/reports/
            android-tv/*/build/test-results/
          retention-days: 14
