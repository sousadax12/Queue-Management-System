name: Android TV

# Called by ci.yml, which decides from the changed paths whether it runs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Covers every module: the TV app (:app), the operator app (:operator) and the shared ones.
      # verifyRoborazziDebug checks the screenshot goldens in */src/test/screenshots.
      - name: Lint, unit tests, screenshot goldens and debug APKs
        working-directory: android-tv
        run: ./gradlew lint testDebugUnitTest verifyRoborazziDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload operator debug APK
        uses: actions/upload-artifact@v7
        with:
          name: operator-debug-apk
          path: android-tv/operator/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-reports
          path: |
            android-tv/*/build/reports/
            android-tv/*/build/test-results/
            android-tv/*/build/outputs/roborazzi/
          retention-days: 14
