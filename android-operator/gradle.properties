# Sized for the memory CGROUP this Hermes worker runs in, not the host's free RAM.
#
# The host showed 6.6 GB free while the kernel was killing this build with
#   "Memory cgroup out of memory: Killed process (java)"
#   constraint=CONSTRAINT_MEMCG, oom_memcg=.../hermes-worker-proc_*.scope
# — i.e. the cap is per worker scope, and a Gradle daemon with a 2-4 GB heap plus
# a Kotlin daemon exceeds it. The symptom is "Gradle build daemon disappeared
# unexpectedly", which looks like a code failure but is memory.
#
# Keep the TOTAL (Gradle daemon + Kotlin daemon + AAPT2) under the cap, run the
# test task and assembleDebug as separate invocations, and never build while the
# emulator is up.
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
